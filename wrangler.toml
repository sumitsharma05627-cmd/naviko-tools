name = "naviko-tools"
main = "functions/api/[[path]].ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api", "/api/*"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "NAVIKO_KV"
id = "abfb0a4b28d84e08ae3db137edc0c5af"
