<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="naviko-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="naviko-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="naviko-n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="naviko-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4338CA" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#naviko-bg)" stroke="url(#naviko-border)" stroke-width="2.5"/>

  <!-- Subtle interior ambient glow -->
  <circle cx="48" cy="16" r="14" fill="#6366F1" opacity="0.22"/>
  <circle cx="16" cy="48" r="12" fill="#10B981" opacity="0.16"/>

  <!-- NAVIKO Modern Bold "N" Symbol -->
  <path d="M 13 18.5 C 13 15.2 16.5 13.2 19.5 15.2 L 43 33.5 L 43 18.5 C 43 15.5 45.5 13 48.5 13 C 51.5 13 54 15.5 54 18.5 L 54 45.5 C 54 48.8 50.5 50.8 47.5 48.8 L 24 30.5 L 24 45.5 C 24 48.5 21.5 51 18.5 51 C 15.5 51 13 48.5 13 45.5 Z"
        fill="url(#naviko-n-grad)"
        filter="url(#shadow)"/>

  <!-- Smart Tool Sparkle Accent on top right -->
  <circle cx="48.5" cy="13" r="3.5" fill="url(#naviko-glow)"/>
  <circle cx="48.5" cy="13" r="1.5" fill="#FFFFFF"/>
</svg>
